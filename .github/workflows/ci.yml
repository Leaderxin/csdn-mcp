name: CI

# Every branch push and every pull request. The matrix exists because the package
# declares `engines.node >=18.17` and is published as ESM with type-only exports —
# both of which break in interesting, Node-version-specific ways.
on:
  push:
  pull_request:

# A push that supersedes an in-flight run is not worth the runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      # One failing Node version should not hide the result of the other two.
      fail-fast: false
      matrix:
        node-version: ['18.x', '20.x', '22.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          # Caching is keyed off package-lock.json, which is committed.
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        # `ci` (not `install`): a lockfile that disagrees with package.json must
        # fail the build instead of being silently rewritten.
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        # The 100% thresholds in vitest.config.ts make this step fail on an
        # uncovered branch — that is the intent, not a misconfiguration.
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Artifact sanity check
        # There is no --help/--version flag to probe: this is a stdio MCP server,
        # so running it detached just blocks waiting for protocol frames. The only
        # honest check is that the build emitted a non-empty entry point, plus the
        # module the live smoke script (scripts/live-smoke.mjs) imports.
        run: |
          set -euo pipefail
          test -f dist/index.js
          test -s dist/index.js
          test -s dist/context.js
          ls -l dist/index.js dist/context.js

      - name: Upload coverage report
        # Primary leg only: the coverage numbers are identical across Node
        # versions, so three copies would only waste storage.
        if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node-20.x
          path: coverage/
          # Fail loudly if coverage silently stopped being produced.
          if-no-files-found: error
          retention-days: 7

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: No credentials in tracked files
        # This repo's whole job is handling a CSDN cookie, so the one mistake
        # that actually matters is committing it. The patterns below match every
        # credential shape this project touches; the .env path check catches the
        # file being added despite .gitignore.
        #
        # Implemented inline rather than with a third-party scanner so the check
        # has no license or network dependency and can be run locally verbatim:
        #   bash .github/workflows/ci.yml  (no)  ->  grep -nE '<pattern>' $(git ls-files)
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked by git — remove it with 'git rm --cached .env'"
            exit 1
          fi
          # A populated CSDN_COOKIE is the one thing that must never be committed.
          if git ls-files -z | xargs -0 grep -lE 'CSDN_COOKIE[[:space:]]*=[[:space:]]*"?[^"[:space:]]{20,}' 2>/dev/null; then
            echo "::error::a populated CSDN_COOKIE literal is committed"
            exit 1
          fi
          # Cookie payload tokens. docs/*.md legitimately mention the NAMES of
          # these fields, so match an assignment to a real-looking value only.
          if git ls-files -z -- ':!docs' ':!*.md' | xargs -0 grep -lE '(UserToken|csrfToken|c_session)[[:space:]]*=[[:space:]]*"?[A-Za-z0-9_-]{16,}' 2>/dev/null; then
            echo "::error::a cookie token value is committed outside the docs"
            exit 1
          fi
          echo "no credentials found in tracked files"
