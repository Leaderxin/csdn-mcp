name: Release

# ─────────────────────────────────────────────────────────────────────────────
# OWNER ACTION REQUIRED — this workflow does not publish anything until you:
#
#   1. Create an npm *Automation* access token (npmjs.com → Access Tokens).
#   2. Add it as a repository secret named NPM_TOKEN:
#      Settings → Secrets and variables → Actions → New repository secret.
#
# Without that secret the publish step is skipped (`if:` guard below) and the
# workflow still finishes green, so forks and first-time checkouts are not
# broken by a missing credential. The GitHub Release is still created, so a
# green run here does NOT prove that anything reached npm — check npmjs.com.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - 'v*'

# `id-token: write` is what makes `npm publish --provenance` possible (it lets
# the runner request the OIDC token npm attaches to the sigstore attestation).
# `contents: write` is for creating the GitHub Release.
permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    # Surfaced to the step-level `if:` below. The `secrets` context is not
    # reliably available inside `if:` expressions, so the secret is promoted to
    # an environment variable first — an unset secret expands to '' and the step
    # is skipped rather than failing the run.
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm
          cache-dependency-path: package-lock.json
          # Writes the registry into .npmrc; NODE_AUTH_TOKEN is what npm reads
          # for authentication at publish time.
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Verify (typecheck + lint + coverage + build)
        # Same gate as CI. A tag is not a reason to skip the tests; the coverage
        # thresholds in vitest.config.ts are part of this step.
        run: npm run verify

      - name: Build
        run: npm run build

      - name: Publish
        if: env.NPM_TOKEN != ''
        # --provenance: attaches a sigstore attestation linking the tarball to
        #               this commit and workflow run (works on public repos).
        # --access public: scoped-free package, but explicit so a future rename
        #                  to a scope cannot flip it back to private by accident.
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create release with generated notes
        # `gh` ships on the GitHub-hosted runner, so no third-party action is
        # needed here. `--generate-notes` produces the same notes as the UI.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Idempotent on purpose. `gh release create` exits 422 with
          # "Release.tag_name already exists" when the release is already there —
          # which happens whenever a maintainer publishes it by hand (as
          # v1.0.0's was), or the job is simply re-run. A release pipeline that
          # goes red for that teaches people to ignore it.
          #
          # An existing release is left untouched rather than refreshed: its
          # notes may have been written by a human, and overwriting them to
          # satisfy an automated re-run would destroy real work.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists — leaving its notes untouched"
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
